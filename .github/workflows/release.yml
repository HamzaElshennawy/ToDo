name: Release

# Builds the APK and publishes it as a GitHub release.
# Start it from Actions → Release → Run workflow (enter a version like 1.1.0),
# or push a tag such as v1.1.0.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 1.1.0"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "push" ]; then RAW="$TAG_NAME"; else RAW="$INPUT_VERSION"; fi
          VERSION="${RAW#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]{1,3}\.[0-9]{1,2}\.[0-9]{1,2}$'; then
            echo "::error::Version must look like 1.2.3 (got '$RAW')"
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          # 1.2.3 -> 10203, so each release has a higher Android versionCode.
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          {
            echo "name=$VERSION"
            echo "code=$CODE"
            echo "tag=v$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Make sure the release doesn't exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew -p core test --stacktrace

      - name: Build the release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          ./gradlew :app:assembleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE" --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "ToDo-$VERSION_NAME.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          gh release create "$TAG" "ToDo-$VERSION_NAME.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ToDo $VERSION_NAME" \
            --generate-notes
